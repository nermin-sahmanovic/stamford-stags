<!--
  Supabase → Authentication → Emails → Templates → "Magic link".
  Subject: Your Stamford Stags sign-in link
  Paste everything below this comment into the message body. Same look as src/lib/email/templates.ts.
  The link goes to our token_hash route (src/app/api/auth/callback), so it works in any browser,
  not just the one that asked for it. {{ .SiteURL }} must be https://stamfordstags.com.
-->
<!doctype html><html><body style="margin:0;background:#F4F6F9;padding:16px">
<div style="max-width:560px;margin:0 auto;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;overflow:hidden">
<div style="background:#0F172A;border-bottom:2px solid #C7EA46;padding:12px 16px;font:700 18px/24px Arial,sans-serif;letter-spacing:1px;color:#FFFFFF">STAMFORD <span style="color:#C7EA46">STAGS</span></div>
<div style="padding:16px;font:16px/1.5 Arial,sans-serif;color:#0F172A">
<p style="margin:0 0 12px">Tap the button to sign in to the Stamford Stags team site.</p>
<div style="margin:16px 0 4px"><a href="{{ .SiteURL }}/api/auth/callback?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#0F172A;color:#C7EA46;border:2px solid #0F172A;border-radius:10px;padding:12px 18px;margin:0 8px 8px 0;font:700 15px/20px Arial,sans-serif;text-decoration:none">Sign in</a></div>
<p style="margin:12px 0 0;font-size:14px;color:#475569">The link works once and expires in an hour. If you didn't ask to sign in, you can ignore this email.</p>
</div>
<div style="padding:12px 16px;border-top:1px solid #E2E8F0;font:13px/1.4 Arial,sans-serif;color:#475569">Stamford Stags · USTA adult league tennis · <a href="{{ .SiteURL }}" style="color:#2563EB">stamfordstags.com</a></div>
</div></body></html>
